[package]
name = "pr-review-core"
version = "0.30.1"
edition = "2021"
description = "Core engine for a self-hosted advisory AI PR reviewer: fetches a pull request diff, reviews it with a Claude model via OpenRouter, and posts line-anchored inline comments plus a summary. Works with GitHub and Bitbucket."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/pr-review-core"
readme = "README.md"
keywords = ["pr-review", "code-review", "openrouter", "github", "bitbucket"]
categories = ["development-tools"]
# The npm/PyPI wrapper sources are not part of the crate a Rust consumer
# installs, and `platforms/` holds hundreds of MB of built binaries at release
# time. Keeping them out of the .crate keeps `cargo package` honest about what
# the library actually is.
exclude = ["packaging/"]

[lib]
name = "pr_review_core"
path = "src/lib.rs"

# The distributable CLI. This is the door for every consumer that is not itself a
# Rust program: a bot written in Python or TypeScript sets env vars, spawns this,
# and reads one JSON object back — see `packaging/`. `RunReviewOutput` was always
# documented as "the HTTP/CLI response"; this makes that literally true.
[[bin]]
name = "kaniscope"
path = "src/bin/kaniscope.rs"
# Not built by default. Three library consumers (kaniscope-action, pr-review-bot,
# vexar) link this crate and none of them want clap in their tree; a bin that is
# always built would put it there. The distribution artifacts are built with
# `--features cli`, so no end user ever types this.
required-features = ["cli"]

[features]
default = []
# Everything the `kaniscope` binary needs and the library does not.
cli = ["dep:clap", "dep:dotenvy", "dep:tracing-subscriber"]

[dependencies]
# `sync` for `OnceCell` (the per-review shared clone). It resolves today without
# being named, because a transitive dependency happens to enable it — which is a
# build that breaks when something else changes its mind. Declare what we use.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# The shared agent loop, from crates.io. A version dep (not git) is required for
# pr-review-core to `cargo publish` its own releases.
agent-loop-core = "0.1"
schemars = "1"
tracing = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ignore = "0.4"
globset = "0.4"
regex = "1"
tempfile = "3"
toml = "0.8"

# Structural context (Tier B): name the enclosing definition of changed lines.
#
# tree-sitter carries `links = "tree-sitter"`, so cargo permits exactly ONE
# version of it anywhere in a dependency graph. That makes this line a
# compatibility contract with every consumer rather than a private choice:
# vexar-core is on 0.26 for its own semantic index, and while this crate sat on
# 0.24 the two could not coexist at all — `cargo build` failed to resolve before
# either crate compiled. Moved to 0.26 with the grammar versions vexar already
# uses. Any grammar that won't build against this tree-sitter should be dropped
# rather than left broken.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.23"

# --- CLI-only (feature `cli`); optional so the library keeps its small tree. ---
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Only to kill a whole process group when a git clone has to be abandoned.
# `Child::kill` signals the direct child, and `git` delegates the network to
# `git-remote-https`, which then survives holding the socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Mock OpenRouter endpoint. `Config::openrouter_base_url` is already injectable,
# so the agent loop can be characterised end-to-end over real HTTP without
# changing production code.
wiremock = "0.6"
